[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derafu-backbone-bridge"
version = "0.1.1"
description = "Generic Python bridge for any derafu/backbone-based PHP library, via swoole/phpy."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Esteban De La Fuente Rubio / Derafu", email = "esteban@sasco.cl" },
]
requires-python = ">=3.14"
dependencies = [
  # Deliberately NOT listing `phpy` (swoole/phpy) here: PyPI already has an
  # unrelated, unmaintained package under that exact name (a different,
  # long-abandoned project). Declaring it would make `pip install` silently
  # install the wrong one on any machine that lacks the real swoole/phpy.
  # The real one is never pip-installable anyway — it requires a PHP build
  # with `--enable-embed` (see docker-python3.14-caddy-server's
  # PHPY_ENABLED option) — so it must already be present system-wide,
  # which is why every install in this repo uses `--system-site-packages`.
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://www.derafu.dev/docs/core/backbone-bridge-python"
Source = "https://github.com/derafu/backbone-bridge-python"

[tool.hatch.build.targets.wheel]
packages = ["derafu_backbone_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]

include = ["**/*.py", "**/*.pyi"]

exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
]

line-length = 79
target-version = "py314"
respect-gitignore = true
fix = true

[tool.ruff.lint]

select = [
  "D",
  "F",
  "E",
  "W",
  "I",
  "UP",
  "N",
  "B",
  "A",
  "C90",
  "ARG",
  "DTZ",
  "TRY",
  "SLF",
  "ERA",
  "PL",
  "RUF",
]

ignore = [
  "D102",
  "D203",
  "D212",
  "TRY400",
  "N818",
  "UP031",
  "TRY003",
  "ARG001",
  "Q001",
  "ERA001",
  "PLC0415",
  "N802",
  "N806",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-statements = 60

[tool.ruff.format]
quote-style = "single"
